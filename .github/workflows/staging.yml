name: Staging — Build & Push

# Runs on every push to develop (i.e. after a PR is merged).
# Builds, tests, then publishes to GHCR with the :staging and
# :staging-<sha> tags.
#
# Staging image reference (for docker-compose):
#   ghcr.io/woolstrand/realruins-server:staging
on:
  push:
    branches: [develop]

jobs:
  # ── Build & test ─────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    container:
      image: swift:5.9

    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # ── Docker build & push ───────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push (staging)
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:staging
            ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
